import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, limit, serverTimestamp, onSnapshot } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyA-1f0mc7E6je47j0k-N2SHP1QbVb2b6mI",
 authDomain: "starswarm-6589b.firebaseapp.com",
 projectId: "starswarm-6589b",
 storageBucket: "starswarm-6589b.firebasestorage.app",
 messagingSenderId: "572136209247",
 appId: "1:572136209247:web:43a80c48628268add914ea"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const panel = document.querySelector('.leaderboard-panel');
const status = document.querySelector('#scoreStatus');
const formArea = document.querySelector('#scoreSubmitArea');
const form = document.querySelector('#scoreForm');
const nameInput = document.querySelector('#nickname');
const submit = document.querySelector('#submitScore');
const scoreList = document.querySelector('#scoreList');
let pendingResult = null;
try { nameInput.value = localStorage.getItem('starswarm.nickname') || ''; } catch (_) {}

function setStatus(message) { status.textContent = message; }
function showListMessage(message) {
 scoreList.replaceChildren();
 const item = document.createElement('li');
 item.className = 'score-message';
 item.textContent = message;
 scoreList.append(item);
}
function renderScores(snapshot) {
 scoreList.replaceChildren();
 if (snapshot.empty) { showListMessage('No scores yet. Be the first!'); return; }
 snapshot.forEach((record) => {
  const data = record.data();
  const item = document.createElement('li');
  const row = document.createElement('div');
  row.className = 'score-row';
  const name = document.createElement('span');
  const points = document.createElement('strong');
  name.textContent = data.nickname || 'Player';
  points.textContent = Number(data.score || 0).toLocaleString('en-US');
  row.append(name, points);
  item.append(row);
  scoreList.append(item);
 });
}
// Live Firestore listener keeps the always-visible rankings up to date.
onSnapshot(
 query(collection(db, 'scores'), orderBy('score', 'desc'), limit(10)),
 renderScores,
 (error) => {
  console.error('Failed to load leaderboard:', error);
  showListMessage('Leaderboard unavailable. Check your connection or Firebase settings.');
 }
);
window.addEventListener('starswarm:restart', () => {
 pendingResult = null;
 formArea.hidden = true;
 setStatus('');
});
window.addEventListener('starswarm:gameover', (event) => {
 pendingResult = { score: event.detail.score, wave: event.detail.wave };
 document.querySelector('#finalScore').textContent = pendingResult.score.toLocaleString('en-US');
 formArea.hidden = false;
 setStatus('');
 if (window.matchMedia('(max-width:1000px)').matches) {
  panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
 }
});
form.addEventListener('submit', async (event) => {
 event.preventDefault();
 if (!pendingResult || submit.disabled) return;
 const nickname = nameInput.value.trim();
 if (!/^[A-Za-z0-9_-]{1,16}$/.test(nickname)) {
  setStatus('Use 1–16 letters, numbers, _ or -.');
  return;
 }
 submit.disabled = true;
 setStatus('Saving score...');
 try {
  if (!auth.currentUser) await signInAnonymously(auth);
  // Give each finished run its own Firestore document. Different runs,
  // including runs from the same anonymous account, remain separate.
  await addDoc(collection(db, 'scores'), {
   uid: auth.currentUser.uid,
   nickname,
   score: pendingResult.score,
   wave: pendingResult.wave,
   createdAt: serverTimestamp()
  });
  setStatus('Score saved! It appears in TOP 10 if high enough.');
  try { localStorage.setItem('starswarm.nickname', nickname); } catch (_) {}
  pendingResult = null;
  formArea.hidden = true;
 } catch (error) {
  console.error('Score submission failed:', error);
  setStatus(error?.code === 'permission-denied'
    ? 'Score not saved. The Firebase owner must publish the updated Firestore Rules for multiple runs.'
    : 'Score not saved. Check your connection or Firebase settings, then try again.');
 } finally {
  submit.disabled = false;
 }
});
</script>
<script>
(()=>{'use strict';

function draw(){g.clearRect(0,0,W,H);let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#07112d');bg.addColorStop(1,'#02030e');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let s of stars){g.globalAlpha=.3+s.r/2.8;g.fillStyle='#c8e7ff';g.fillRect(s.x,s.y,s.r,s.r)}g.globalAlpha=1;
