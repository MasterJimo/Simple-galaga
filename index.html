<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Swarm — arcade shooter</title><style>
*{box-sizing:border-box}body{margin:0;background:#060a19;color:#e9f4ff;font:16px system-ui,Arial;display:grid;place-items:center;min-height:100vh}.shell{width:min(100%,760px);padding:12px;display:flex;flex-direction:column;align-items:center}h1{margin:0 0 5px;letter-spacing:.22em;text-align:center;color:#8deaff;text-shadow:0 0 20px #21a9ff}p{margin:5px 0;text-align:center;color:#aebdd4}.controls{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin:7px 0}.controls label{font-size:13px;display:flex;align-items:center;gap:7px}input{accent-color:#56ddff;width:105px}canvas{display:block;width:100%;height:auto;max-width:100%;margin:0 auto;border:1px solid #315076;border-radius:12px;box-shadow:0 0 45px #13519c55;background:#020512}button{background:#113c63;border:1px solid #58cfff;border-radius:7px;color:white;padding:7px 12px;cursor:pointer}button:hover{background:#195d90}
.score-overlay{position:fixed;inset:0;z-index:10;background:#020817dd;display:grid;place-items:center;padding:16px}
.score-overlay[hidden],.score-submit[hidden]{display:none!important}
.score-card{position:relative;width:min(460px,100%);max-height:min(92vh,740px);overflow:auto;background:#101e3b;border:1px solid #58cfff;border-radius:14px;padding:22px;box-shadow:0 0 55px #000b}
.score-card h2{color:#8deaff;text-align:center;letter-spacing:.12em;margin:0 0 14px;font-size:24px}
.score-close{float:right}
.score-submit{background:#142747;border-radius:8px;padding:12px;margin:12px 0}
.score-submit p{color:#e9f4ff}
.score-submit form{display:flex;flex-wrap:wrap;gap:8px;align-items:end;justify-content:center}
.score-submit label{display:flex;flex-direction:column;gap:4px;font-size:13px}
.score-submit input{width:160px;background:#060c1b;color:#fff;border:1px solid #58cfff;border-radius:5px;padding:8px}
.score-list{padding-left:28px;margin:12px 0}
.score-list li{padding:7px 4px;border-bottom:1px solid #ffffff20}
.score-row{display:flex;justify-content:space-between;gap:10px}
.score-row span{overflow-wrap:anywhere}
.score-status{min-height:22px;color:#a3dff0;text-align:center}
.score-note{font-size:12px;opacity:.85}
.credit{font-size:12px;opacity:.7;margin:3px 0 0;letter-spacing:.04em}</style></head><body><div class="shell"><h1>STAR SWARM</h1><p>A classic-inspired space arcade shooter</p><div class="controls"><label>♫ Music <input id="music" type="range" min="0" max="100" value="22"></label><label>✦ SFX <input id="sfx" type="range" min="0" max="100" value="40"></label><button id="start">START / RESTART</button><button id="mute">Mute</button><button id="showScores" type="button">🏆 Leaderboard</button></div><canvas id="game" width="720" height="680" aria-label="Space shooter game"></canvas><p>← → or A / D — move · Space — shoot · Enter — start · P — pause</p><p class="credit">Created by Mr Jim</p></div>
<div id="scoreOverlay" class="score-overlay" hidden role="dialog" aria-modal="true" aria-labelledby="scoreTitle">
 <div class="score-card">
  <button id="closeScores" class="score-close" type="button" aria-label="Close leaderboard">Close ×</button>
  <h2 id="scoreTitle">🏆 LEADERBOARD</h2>
  <div id="scoreSubmitArea" class="score-submit" hidden>
   <p>Game over! Your score: <strong id="finalScore">0</strong></p>
   <form id="scoreForm">
    <label for="nickname">Nickname (2–16 characters)
     <input id="nickname" type="text" maxlength="16" minlength="2" pattern="[A-Za-z0-9_-]{2,16}" autocomplete="nickname" required placeholder="SpaceAce">
    </label>
    <button id="submitScore" type="submit">Submit Score</button>
   </form>
  </div>
  <p id="scoreStatus" class="score-status" role="status" aria-live="polite"></p>
  <ol id="scoreList" class="score-list"><li>Open leaderboard to load scores.</li></ol>
  <p class="score-note">Top 10 highest scores. One personal best per anonymous player.</p>
 </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, setDoc, query, orderBy, limit, serverTimestamp } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

const firebaseConfig = {
 apiKey: "AIzaSyA-1f0mc7E6je47j0k-N2SHP1QbVb2b6mI",
 authDomain: "starswarm-6589b.firebaseapp.com",
 projectId: "starswarm-6589b",
 storageBucket: "starswarm-6589b.firebasestorage.app",
 messagingSenderId: "572136209247",
 appId: "1:572136209247:web:43a80c48628268add914ea"
};
const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const overlay = document.querySelector('#scoreOverlay');
const status = document.querySelector('#scoreStatus');
const formArea = document.querySelector('#scoreSubmitArea');
const form = document.querySelector('#scoreForm');
const nameInput = document.querySelector('#nickname');
const submit = document.querySelector('#submitScore');
const scoreList = document.querySelector('#scoreList');
let pendingResult = null;
let loading = false;
try { nameInput.value = localStorage.getItem('starswarm.nickname') || ''; } catch (_) {}

function setStatus(message) { status.textContent = message; }
async function refreshScores() {
 if (loading) return;
 loading = true;
 scoreList.replaceChildren();
 const loadingRow = document.createElement('li');
 loadingRow.textContent = 'Loading scores...';
 scoreList.append(loadingRow);
 try {
  const snapshot = await getDocs(query(collection(db, 'scores'), orderBy('score', 'desc'), limit(10)));
  scoreList.replaceChildren();
  if (snapshot.empty) {
   const empty = document.createElement('li');
   empty.textContent = 'No scores yet. Be the first!';
   scoreList.append(empty);
  }
  snapshot.forEach((record) => {
   const data = record.data();
   const item = document.createElement('li');
   const row = document.createElement('div');
   row.className = 'score-row';
   const name = document.createElement('span');
   const points = document.createElement('strong');
   name.textContent = data.nickname || 'Player';
   points.textContent = Number(data.score || 0).toLocaleString('en-US');
   row.append(name, points);
   item.append(row);
   scoreList.append(item);
  });
 } catch (error) {
  scoreList.replaceChildren();
  const item = document.createElement('li');
  item.textContent = 'Leaderboard unavailable. Check Firestore setup and Security Rules.';
  scoreList.append(item);
  console.error('Failed to load leaderboard:', error);
 } finally {
  loading = false;
 }
}
function openScores() {
 overlay.hidden = false;
 formArea.hidden = !pendingResult;
 if (pendingResult) document.querySelector('#finalScore').textContent = pendingResult.score.toLocaleString('en-US');
 refreshScores();
}
function closeScores() { overlay.hidden = true; }
document.querySelector('#showScores').addEventListener('click', openScores);
document.querySelector('#closeScores').addEventListener('click', closeScores);
overlay.addEventListener('click', (event) => { if (event.target === overlay) closeScores(); });
document.addEventListener('keydown', (event) => { if (event.code === 'Escape' && !overlay.hidden) closeScores(); });
window.addEventListener('starswarm:restart', () => { pendingResult = null; formArea.hidden = true; closeScores(); setStatus(''); });
window.addEventListener('starswarm:gameover', (event) => {
 pendingResult = { score: event.detail.score, wave: event.detail.wave };
 setStatus('');
 openScores();
});
form.addEventListener('submit', async (event) => {
 event.preventDefault();
 if (!pendingResult || submit.disabled) return;
 const nickname = nameInput.value.trim();
 if (!/^[A-Za-z0-9_-]{2,16}$/.test(nickname)) {
  setStatus('Use 2–16 letters, numbers, _ or -.');
  return;
 }
 submit.disabled = true;
 setStatus('Saving score...');
 try {
  if (!auth.currentUser) await signInAnonymously(auth);
  const ref = doc(db, 'scores', auth.currentUser.uid);
  const previous = await getDoc(ref);
  if (previous.exists() && previous.data().score >= pendingResult.score) {
   setStatus('Your personal best is already ' + Number(previous.data().score).toLocaleString('en-US') + '. Beat it to update the leaderboard.');
  } else {
   await setDoc(ref, {
    uid: auth.currentUser.uid,
    nickname,
    score: pendingResult.score,
    wave: pendingResult.wave,
    createdAt: serverTimestamp()
   });
   setStatus('Score saved! Nice run.');
   try { localStorage.setItem('starswarm.nickname', nickname); } catch (_) {}
   await refreshScores();
  }
  pendingResult = null;
  formArea.hidden = true;
 } catch (error) {
  console.error('Score submission failed:', error);
  setStatus('Could not save. Check Anonymous Authentication and Firestore Security Rules, then try again.');
 } finally {
  submit.disabled = false;
 }
});
</script>
<script>
(()=>{'use strict';
const c=document.querySelector('#game'),g=c.getContext('2d'),music=document.querySelector('#music'),sfx=document.querySelector('#sfx');const W=c.width,H=c.height;
function fitGameToViewport(){
 const shell=c.parentElement, box=getComputedStyle(shell);
 const paddingX=parseFloat(box.paddingLeft)+parseFloat(box.paddingRight);
 const paddingY=parseFloat(box.paddingTop)+parseFloat(box.paddingBottom);
 const otherHeight=Array.from(shell.children).filter(el=>el!==c).reduce((total,el)=>{
  const css=getComputedStyle(el);
  return total+el.getBoundingClientRect().height+parseFloat(css.marginTop)+parseFloat(css.marginBottom);
 },0);
 const availableHeight=Math.max(100,(window.visualViewport?.height??window.innerHeight)-paddingY-otherHeight-10);
 const availableWidth=Math.max(100,shell.clientWidth-paddingX);
 const scale=Math.min(1,availableWidth/W,availableHeight/H);
 c.style.width=Math.floor(W*scale)+'px';
 c.style.height=Math.floor(H*scale)+'px';
}
fitGameToViewport();
window.addEventListener('resize',fitGameToViewport);
window.visualViewport?.addEventListener('resize',fitGameToViewport);
let audio=null,master=null,musicGain=null,sfxGain=null,musicTimer=null,beat=0,muted=false;
function soundInit(){if(audio){audio.resume();return}audio=new (window.AudioContext||window.webkitAudioContext)();master=audio.createGain();musicGain=audio.createGain();sfxGain=audio.createGain();musicGain.connect(master);sfxGain.connect(master);master.connect(audio.destination);setVolume();musicTimer=setInterval(playMusic,230)}
function setVolume(){if(!audio)return;musicGain.gain.value=muted?0:music.value/100*.34;sfxGain.gain.value=muted?0:sfx.value/100*.48}
function tone(freq,dur,type='sine',volume=.18,dest=sfxGain,slide=0){if(!audio)return;let t=audio.currentTime,o=audio.createOscillator(),v=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),t+dur);v.gain.setValueAtTime(Math.max(.0001,volume),t);v.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(v);v.connect(dest);o.start(t);o.stop(t+dur+.02)}
const melody=[220,0,330,440,0,392,330,0,262,0,330,392,0,294,247,0];
function playMusic(){if(state==='playing'){let n=melody[beat++%melody.length];if(n)tone(n,.18,'triangle',.18,musicGain);if(beat%4===1)tone(110,.15,'sine',.15,musicGain)}}
music.oninput=sfx.oninput=setVolume;document.querySelector('#mute').onclick=()=>{muted=!muted;setVolume();document.querySelector('#mute').textContent=muted?'Unmute':'Mute'};
let state='menu',score=0,lives=3,wave=1,frame=0,player,bullets=[],enemyShots=[],enemies=[],particles=[],stars=[],keys=new Set(),last=0,spawnClock=0;
for(let i=0;i<115;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.8+.3,s:Math.random()*1.7+.35});
function reset(){window.dispatchEvent(new Event('starswarm:restart'));soundInit();state='playing';score=0;lives=3;wave=1;frame=0;bullets=[];enemyShots=[];particles=[];player={x:W/2,y:H-78,cool:0,inv:110};makeWave()}
function makeWave(){enemies=[];for(let row=0;row<4;row++)for(let col=0;col<9;col++)enemies.push({x:90+col*67,y:125+row*60,homeX:90+col*67,homeY:125+row*60,row,col,hp:row===0?2:1,mode:'formation',t:0,phase:Math.random()*6.28});spawnClock=0}
document.querySelector('#start').onclick=reset;document.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','Space','ArrowUp'].includes(e.code))e.preventDefault();keys.add(e.code);if(e.code==='Enter'&&state!=='playing')reset();if(e.code==='KeyP'){if(state==='playing')state='paused';else if(state==='paused')state='playing'}if(e.code==='Space'&&state==='menu')reset();if(audio)audio.resume()});document.addEventListener('keyup',e=>keys.delete(e.code));
function burst(x,y,color,n=14){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:25+Math.random()*22,color})}}
function fire(){if(player.cool>0)return;bullets.push({x:player.x,y:player.y-25});player.cool=10;tone(780,.09,'square',.065,sfxGain,-530)}
function drawShip(x,y,scale=1,enemy=false,row=0){g.save();g.translate(x,y);g.scale(scale,scale);g.shadowBlur=17;g.shadowColor=enemy?(row===0?'#ff73b7':'#4affce'):'#4fcaff';g.fillStyle=enemy?(row===0?'#f254aa':row===1?'#f7ad50':'#43e0bf'):'#49bfff';g.beginPath();if(enemy){g.moveTo(0,-21);g.lineTo(13,-9);g.lineTo(23,-13);g.lineTo(18,12);g.lineTo(7,8);g.lineTo(0,17);g.lineTo(-7,8);g.lineTo(-18,12);g.lineTo(-23,-13);g.lineTo(-13,-9)}else{g.moveTo(0,-29);g.lineTo(11,-10);g.lineTo(24,-3);g.lineTo(30,18);g.lineTo(10,12);g.lineTo(0,21);g.lineTo(-10,12);g.lineTo(-30,18);g.lineTo(-24,-3);g.lineTo(-11,-10)}g.closePath();g.fill();g.shadowBlur=0;g.fillStyle=enemy?'#fff2a1':'#e2fbff';g.beginPath();g.moveTo(0,enemy?-12:-18);g.lineTo(6,3);g.lineTo(0,9);g.lineTo(-6,3);g.closePath();g.fill();if(!enemy){g.fillStyle='#ffb54e';g.fillRect(-17,16,7,7+Math.random()*9);g.fillRect(10,16,7,7+Math.random()*9)}g.restore()}
function hit(a,b,r){return Math.hypot(a.x-b.x,a.y-b.y)<r}
function update(dt){if(state!=='playing')return;frame+=dt;for(let s of stars){s.y+=s.s*dt;if(s.y>H)s.y=0}
if(keys.has('ArrowLeft')||keys.has('KeyA'))player.x-=6.5*dt;if(keys.has('ArrowRight')||keys.has('KeyD'))player.x+=6.5*dt;player.x=Math.max(32,Math.min(W-32,player.x));player.cool=Math.max(0,player.cool-dt);player.inv=Math.max(0,player.inv-dt);if(keys.has('Space'))fire();
for(let b of bullets)b.y-=12*dt;bullets=bullets.filter(b=>b.y>-20);
for(let b of enemyShots)b.y+=b.vy*dt;enemyShots=enemyShots.filter(b=>b.y<H+20);
spawnClock+=dt;if(spawnClock>Math.max(30,105-wave*6)){spawnClock=0;let pool=enemies.filter(e=>e.mode==='formation');if(pool.length){let e=pool[Math.floor(Math.random()*pool.length)];e.mode='dive';e.t=0;e.sx=e.x;e.sy=e.y;e.targetX=player.x}}
for(let e of enemies){if(e.mode==='formation'){e.x=e.homeX+Math.sin(frame*.014)*34;e.y=e.homeY+Math.sin(frame*.026+e.phase)*5}else{e.t+=dt;let t=e.t;e.x=e.sx+Math.sin(t*.055+e.phase)*85+(e.targetX-e.sx)*Math.min(1,t/110)*.6;e.y=e.sy+t*(2.8+wave*.22);if(e.y>H+35){e.mode='formation';e.x=e.homeX;e.y=-30}}if(Math.random()<(.0005+wave*.00009)*dt){enemyShots.push({x:e.x,y:e.y+15,vy:4+wave*.3})}
for(let b of bullets)if(!b.dead&&hit(b,e,23)){b.dead=true;e.hp--;burst(b.x,b.y,'#7cf5ff',5);if(e.hp<=0){e.dead=true;score+=e.mode==='dive'?150:rowPoints(e.row);burst(e.x,e.y,e.row===0?'#ff70bd':'#63ffd5',22);tone(180,.2,'sawtooth',.12,sfxGain,-140)}}if(player.inv<=0&&hit(e,player,28)){e.dead=true;damage()}}
enemies=enemies.filter(e=>!e.dead);bullets=bullets.filter(b=>!b.dead);
for(let b of enemyShots)if(player.inv<=0&&hit(b,player,20)){b.dead=true;damage()}enemyShots=enemyShots.filter(b=>!b.dead);
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;p.vx*=.98;p.vy*=.98}particles=particles.filter(p=>p.life>0);
if(!enemies.length){wave++;makeWave();player.inv=90;tone(660,.3,'triangle',.15,sfxGain,350)}}
function rowPoints(row){return [100,80,60,50][row]}
function damage(){lives--;player.inv=120;burst(player.x,player.y,'#6bdcff',34);tone(140,.42,'sawtooth',.23,sfxGain,-100);if(lives<=0){state='gameover';window.dispatchEvent(new CustomEvent('starswarm:gameover',{detail:{score,wave}}))}}
function draw(){g.clearRect(0,0,W,H);let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#07112d');bg.addColorStop(1,'#02030e');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let s of stars){g.globalAlpha=.3+s.r/2.8;g.fillStyle='#c8e7ff';g.fillRect(s.x,s.y,s.r,s.r)}g.globalAlpha=1;
g.font='bold 23px system-ui';g.fillStyle='#a9efff';g.fillText('SCORE  '+String(score).padStart(6,'0'),25,42);g.textAlign='right';g.fillText('WAVE  '+wave,W-25,42);g.textAlign='left';g.fillStyle='#f8a8c3';g.font='19px system-ui';g.fillText('♥ '.repeat(Math.max(0,lives)),25,H-24);
for(let e of enemies)drawShip(e.x,e.y,.86,true,e.row);
for(let b of bullets){g.shadowBlur=13;g.shadowColor='#8beeff';g.fillStyle='#aefaff';g.fillRect(b.x-3,b.y-13,6,22)}for(let b of enemyShots){g.shadowColor='#ff5e88';g.fillStyle='#ff6d93';g.fillRect(b.x-3,b.y-5,6,13)}g.shadowBlur=0;
for(let p of particles){g.globalAlpha=Math.min(1,p.life/35);g.fillStyle=p.color;g.fillRect(p.x,p.y,3,3)}g.globalAlpha=1;
if(player&&!(player.inv>0&&Math.floor(frame/5)%2===0))drawShip(player.x,player.y);
if(state!=='playing'){g.fillStyle='#010816bb';g.fillRect(0,0,W,H);g.textAlign='center';g.fillStyle='#a5efff';g.font='bold 48px system-ui';g.fillText(state==='gameover'?'GAME OVER':state==='paused'?'PAUSED':'STAR SWARM',W/2,H/2-36);g.font='22px system-ui';g.fillStyle='#f3f8ff';g.fillText(state==='gameover'?'Score: '+score:state==='paused'?'Press P to resume':'Classic-inspired space shooter',W/2,H/2+14);g.font='19px system-ui';g.fillText(state==='paused'?'':'Press Enter or START to play',W/2,H/2+55);g.textAlign='left'}}
function loop(t){let dt=Math.min(2,(t-last)/16.667||1);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
})();
</script></body></html>
