name: Build Windows EXE
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - name: Install dependencies
        run: npm install
      - name: Prepare web game
        run: npm run prepare:web
      - name: Build Windows installer
        run: npx tauri build --bundles nsis
      - name: Upload EXE as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Simple-Galaga-Windows-EXE
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
      - name: Publish GitHub Release for version tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: gh release create "${{ github.ref_name }}" src-tauri/target/release/bundle/nsis/*.exe --title "Simple Galaga ${{ github.ref_name }}" --generate-notes
